name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke check
        shell: pwsh
        run: |
          $exe = "build/Release/LazyEnv.exe"
          if (!(Test-Path $exe)) { throw "$exe not found" }
          $res = "build/Release/resources/index.html"
          if (!(Test-Path $res)) { throw "$res not found" }
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(\s*LazyEnv\s+VERSION\s+(\d+\.\d+\.\d+)') { throw "Cannot parse project VERSION" }
          $expected = $Matches[1]
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "expected $expected, exe ProductVersion $ver"
          if ($ver -ne $expected) { throw "Version resource $ver != CMakeLists $expected" }
          $stamped = Select-String -Path $res -Pattern 'LazyEnv v(\d+\.\d+\.\d+)' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if ($stamped -ne $expected) { throw "Frontend stamped version '$stamped' != $expected" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LazyEnv-windows-x64
          path: |
            build/Release/LazyEnv.exe
            build/Release/resources/
          if-no-files-found: error
