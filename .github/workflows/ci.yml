name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        shell: pwsh
        run: |
          ./build/Release/test_v0814.exe
          if ($LASTEXITCODE -ne 0) { throw "test_v0814 failed: $LASTEXITCODE" }
          ./build/Release/test_v090.exe
          if ($LASTEXITCODE -ne 0) { throw "test_v090 failed: $LASTEXITCODE" }

      - name: WebView2 runtime probe
        shell: pwsh
        run: |
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $false
          foreach ($root in @('HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\','HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\','HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\')) {
            $p = $root + $guid
            if (Test-Path $p) { Write-Host "WebView2 runtime at $p => $((Get-ItemProperty $p).pv)"; $found = $true }
          }
          if (-not $found) { Write-Host 'WEBVIEW2 RUNTIME REGISTRY NOT FOUND' }
          Get-Process msedgewebview2 -ErrorAction SilentlyContinue | Select-Object -First 3 | Format-Table Id,ProcessName -AutoSize

      - name: E2E tests (CDP)
        shell: pwsh
        run: |
          node --version
          node tests/test_cdp_v090.mjs
          if ($LASTEXITCODE -ne 0) { throw "cdp v090 failed" }
          node tests/test_cdp_v0814.mjs
          if ($LASTEXITCODE -ne 0) { throw "cdp v0814 failed" }
          node tests/test_cdp_path_smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw "path smoke failed" }

      - name: Smoke check
        shell: pwsh
        run: |
          $exe = "build/Release/LazyEnv.exe"
          if (!(Test-Path $exe)) { throw "$exe not found" }
          $res = "build/Release/resources/index.html"
          if (!(Test-Path $res)) { throw "$res not found" }
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(\s*LazyEnv\s+VERSION\s+(\d+\.\d+\.\d+)') { throw "Cannot parse project VERSION" }
          $expected = $Matches[1]
          $ver = (Get-Item $exe).VersionInfo.ProductVersion
          Write-Host "expected $expected, exe ProductVersion $ver"
          if ($ver -ne $expected) { throw "Version resource $ver != CMakeLists $expected" }
          $stamped = Select-String -Path $res -Pattern 'LazyEnv v(\d+\.\d+\.\d+)' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          if ($stamped -ne $expected) { throw "Frontend stamped version '$stamped' != $expected" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LazyEnv-windows-x64
          path: |
            build/Release/LazyEnv.exe
            build/Release/resources/
          if-no-files-found: error
